# Cấu hình triển khai backend lên Render.com (New > Blueprint > chọn repo này)
services:
  - type: web
    name: pcstore-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # Bỏ thư viện chỉ dùng để chạy test (mongodb-memory-server)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      # Chuỗi kết nối MongoDB Atlas, nhập trong Render > Environment (không lưu trong code)
      - key: MONGODB_URI
        sync: false
